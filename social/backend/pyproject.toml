[project]
name = "steamscope-social"
version = "0.2.0"
description = "SteamScope social platform — verified identity, accounts and privacy"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=6,<9",
  "httpx>=0.28,<1",
  "tzdata>=2025.1,<2028",
  "websockets>=15,<16",
  "pillow>=13.0.0,<14",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamscope_social"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -ra"
markers = [
  "integration: real isolated services; opt in with SOCIAL_INTEGRATION=1",
  "postgres: requires only the isolated PostgreSQL test database",
]
